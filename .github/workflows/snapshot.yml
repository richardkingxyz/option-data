name: snapshot
on:
  schedule:
    - cron: '17 */6 * * *'   # four times a day
  workflow_dispatch:
permissions:
  contents: write
concurrency: snapshot
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/snapshot.mjs
      - run: node scripts/onchain-stats.mjs
        env:
          RPC_URL: ${{ secrets.RPC_URL }}
          PROGRAM_ID: ${{ secrets.PROGRAM_ID }}
          WORKSTATION_PASSWORD: ${{ secrets.WORKSTATION_PASSWORD }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.json data/stats.enc
          git diff --cached --quiet || git commit -m "snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
