name: orderflow digest
on:
  schedule:
    - cron: '30 0 * * 1'   # Monday 00:30 UTC, for the ISO week that just ended
  workflow_dispatch:
    inputs:
      week:
        description: 'ISO week to digest, e.g. 2026-W45 (default: last week)'
        required: false
permissions:
  contents: write
concurrency: orderflow-digest
jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Telegram posting stays off unless the two secrets exist AND the repository variable
      # ORDERFLOW_TG_ENABLED is "true" (Settings -> Secrets and variables -> Actions -> Variables).
      - run: node scripts/weekly-digest.mjs ${{ inputs.week }}
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          ORDERFLOW_TG_ENABLED: ${{ vars.ORDERFLOW_TG_ENABLED }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/orderflow/digest
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "orderflow digest $(ls data/orderflow/digest/*.md | sed 's#.*/##; s#\.md##' | sort | tail -1)"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            sleep $((i * 10))
          done
          exit 1
